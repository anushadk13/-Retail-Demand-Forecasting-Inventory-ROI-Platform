version: 2
models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: item_id
        tests: [unique, not_null]
      - name: category
        tests:
          - not_null
          - accepted_values:
              values: ["FOODS", "HOBBIES", "HOUSEHOLD"]
  - name: dim_store
    columns:
      - name: store_key
        tests: [unique, not_null]
      - name: store_id
        tests: [unique, not_null]
      - name: state
        tests:
          - accepted_values:
              values: ["CA", "TX", "WI"]
  - name: dim_price
    columns:
      - name: price_key
        tests: [unique, not_null]
      - name: sell_price
        tests: [not_null]
      - name: price_band
        tests:
          - accepted_values:
              values: ["promo", "regular", "premium"]
  - name: fact_sales
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: product_key
        tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: store_key
        tests:
          - not_null
          - relationships: {to: ref('dim_store'), field: store_key}
      - name: price_key
        tests:
          - not_null
          - relationships: {to: ref('dim_price'), field: price_key}
      - name: units_sold
        tests: [not_null]
  - name: fact_inventory
    columns:
      - name: stock_on_hand
        tests: [not_null]
